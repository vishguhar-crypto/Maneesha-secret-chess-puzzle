<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maneesha's Secret Chess Quest ❤</title>
  <style>
    body {
      background-color: #fff0f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #333;
    }

    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
      border: 2px solid #ffb6c1;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    h1, h2 {
      color: #d81b60;
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    p {
      color: #555;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    input[type="password"] {
      width: 80%;
      padding: 12px;
      margin: 20px 0 10px 0;
      border: 2px solid #ffb6c1;
      border-radius: 25px;
      outline: none;
      text-align: center;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      background-color: #ff69b4;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    #errorMsg {
      color: #e53935;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }

    /* Fixed Board Grid & Equal Box Sizes */
    #board {
      display: grid;
      grid-template-columns: repeat(8, 40px);
      grid-template-rows: repeat(8, 40px);
      width: 320px;
      height: 320px;
      margin: 20px auto;
      border: 3px solid #d81b60;
      border-radius: 8px;
      overflow: hidden;
    }

    .square {
      width: 40px;
      height: 40px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      line-height: 1;
      user-select: none;
      cursor: pointer;
    }

    .white-square { background-color: #ffe6eb; }
    .black-square { background-color: #ff99bb; }
    .square.selected { background-color: #ff1493 !important; color: white; }

    .modal {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
      border: 3px solid #ff69b4;
      z-index: 100;
      width: 80%;
      max-width: 350px;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 99;
    }
  </style>
</head>
<body>

  <!-- Password Section -->
  <div id="passwordSection" class="card">
    <h1 id="passTitle">🔒 Top Secret Area!</h1>
    <p id="passDesc">Welcome to your secret 10-level chess quest, Maneesha! ✨<br>Enter the secret passcode to unlock!</p>

    <input type="password" id="passInput" placeholder="Enter Secret Passcode..." />
    <br>
    <button onclick="checkPassword()">Unlock Puzzle 🔓</button>
    <div id="errorMsg">Wrong passcode! Try again 😜</div>
  </div>

  <!-- Game Section -->
  <div id="gameSection" class="card" style="display:none;">
    <h2 id="levelTitle">Level 1</h2>
    <p id="levelInstruction">White to play: Find the checkmate move!</p>
    <div id="board"></div>
  </div>

  <!-- Victory Overlay -->
  <div id="overlay" class="overlay"></div>
  <div id="successModal" class="modal">
    <h3 id="modalHeader">Level Complete! 🎉</h3>
    <p id="modalMsg" style="font-size: 1.05rem; color: #d81b60; font-weight: 500;"></p>
    <button id="nextBtn" onclick="nextLevel()">Proceed to Next Level ➔</button>
  </div>

  <script>
    const PIECES = {
      'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
      'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
    };

    const levels = [
      {
        level: 1,
        title: "Level 1: Back-Rank Mate ♟️",
        password: "bignose",
        instruction: "White to play: Deliver checkmate in 1 move!",
        boardState: { 'g8': 'k', 'f7': 'p', 'g7': 'p', 'h7': 'p', 'e1': 'R', 'g1': 'K', 'f2': 'P', 'g2': 'P', 'h2': 'P' },
        winningMove: { from: 'e1', to: 'e8' },
        message: "🎉 Level 1 unlocked! 🔓 Okay, you’re smarter than I thought."
      },
      {
        level: 2,
        title: "Level 2: Smothered Mate ♟️",
        password: "pikachu",
        instruction: "White to play: Smother Black's King!",
        boardState: { 'h8': 'k', 'g8': 'r', 'g7': 'p', 'h7': 'p', 'f6': 'N', 'g1': 'K' },
        winningMove: { from: 'f6', to: 'f7' },
        message: "Level 2 unlocked 🔓❤️ I like your eyes, your voice… and that big big noseeee of yours."
      },
      {
        level: 3,
        title: "Level 3: Boden's Mate ♟️",
        password: "book",
        instruction: "White to play: Checkmate using the Bishops!",
        boardState: { 'c8': 'k', 'b8': 'r', 'b7': 'p', 'a7': 'p', 'f4': 'B', 'a6': 'B', 'g1': 'K' },
        winningMove: { from: 'f4', to: 'c7' },
        message: "Level 3 unlocked 🔓💖 You look super cute when you get mad at me."
      },
      {
        level: 4,
        title: "Level 4: Scholar's Attack ♟️",
        password: "dentists are not doctors",
        instruction: "White to play: Find the checkmate move!",
        boardState: { 'e8': 'k', 'e5': 'p', 'f7': 'p', 'c4': 'B', 'h5': 'Q', 'g1': 'K' },
        winningMove: { from: 'h5', to: 'f7' },
        message: "Level 4 unlocked 🔓✨ I love the way you talk when you’re excited about something."
      },
      {
        level: 5,
        title: "Level 5: Anastasia's Mate ♟️",
        password: "camel",
        instruction: "White to play: Checkmate along the open file!",
        boardState: { 'h8': 'k', 'g7': 'p', 'e7': 'N', 'a1': 'R', 'g1': 'K' },
        winningMove: { from: 'a1', to: 'h1' },
        message: "Level 5 unlocked 🔓🌸 Halfway through! You’re actually really good at this."
      },
      {
        level: 6,
        title: "Level 6: Arabian Mate ♟️",
        password: "i love vishal",
        instruction: "White to play: Coordinate Rook & Knight!",
        boardState: { 'h8': 'k', 'f6': 'N', 'b7': 'R', 'g1': 'K' },
        winningMove: { from: 'b7', to: 'h7' },
        message: "Level 6 unlocked 🔓 hmmm... lagta h dimag toh h tum me."
      },
      {
        level: 7,
        title: "Level 7: Greco's Mate ♟️",
        password: "kela",
        instruction: "White to play: Deliver checkmate!",
        boardState: { 'g8': 'k', 'f7': 'p', 'g7': 'p', 'd3': 'B', 'h4': 'Q', 'g1': 'K' },
        winningMove: { from: 'h4', to: 'h7' },
        message: "Level 7 unlocked 🔓 badhiya khel rhi ho, aese hi life me mere sath khelna h tumhe."
      },
      {
        level: 8,
        title: "Level 8: Dovetail Mate ♟️️",
        password: "mera hogya",
        instruction: "White to play: Find the lethal Queen checkmate!",
        boardState: { 'f7': 'k', 'e7': 'p', 'g7': 'p', 'd5': 'Q', 'g1': 'K' },
        winningMove: { from: 'd5', to: 'e6' },
        message: "Level 8 unlocked 🔓 tum soch rhi ho bas chess solve kr rhi ho, pr me toh roz tum par haar rha hu."
      },
      {
        level: 9,
        title: "Level 9: Opera Mate ♟️",
        password: "hello again",
        instruction: "White to play: Checkmate with the Rook!",
        boardState: { 'd8': 'k', 'c7': 'p', 'b8': 'b', 'f3': 'B', 'd1': 'R', 'g1': 'K' },
        winningMove: { from: 'd1', to: 'd8' },
        message: "Level 9 unlocked 🔓 One last step... ready for the final answer?"
      },
      {
        level: 10,
        title: "Level 10: Romantic Checkmate ❤️",
        password: "tum pyar ho mera",
        instruction: "White to play: Deliver the final checkmate!",
        boardState: { 'g8': 'k', 'f7': 'p', 'g7': 'p', 'h7': 'p', 'g6': 'Q', 'f6': 'B', 'g1': 'K' },
        winningMove: { from: 'g6', to: 'g7' },
        message: "🎉 LEVEL 10 COMPLETE! ❤️\n\nNo more puzzles… I love you Maneesha. Forever and always."
      }
    ];

    let currentLevelIndex = 0;
    let currentBoardState = {};
    let selectedSquare = null;

    function loadPasswordScreen() {
      const lvl = levels[currentLevelIndex];
      document.getElementById('passTitle').innerText = `🔒 Unlock Level ${lvl.level}`;
      document.getElementById('passDesc').innerText = lvl.level > 1 ? `Enter the secret passcode to access Level ${lvl.level}!` : `Welcome to your secret 10-level chess quest, Maneesha! ✨`;
      document.getElementById('passInput').value = '';
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('passwordSection').style.display = 'block';
      document.getElementById('gameSection').style.display = 'none';
    }

    function checkPassword() {
      const input = document.getElementById('passInput').value.trim().toLowerCase();
      const currentLevel = levels[currentLevelIndex];
      if (input === currentLevel.password.toLowerCase()) {
        document.getElementById('passwordSection').style.display = 'none';
        document.getElementById('gameSection').style.display = 'block';
        initLevel(currentLevel);
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    function initLevel(lvlData) {
      document.getElementById('levelTitle').innerText = lvlData.title;
      document.getElementById('levelInstruction').innerText = lvlData.instruction;
      currentBoardState = JSON.parse(JSON.stringify(lvlData.boardState));
      selectedSquare = null;
      renderBoard();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const squareId = files[f] + ranks[r];
          const isWhiteSquare = (r + f) % 2 === 0;

          const squareEl = document.createElement('div');
          squareEl.className = `square ${isWhiteSquare ? 'white-square' : 'black-square'}`;
          if (selectedSquare === squareId) squareEl.classList.add('selected');

          if (currentBoardState[squareId]) {
            squareEl.innerText = PIECES[currentBoardState[squareId]];
          }

          squareEl.addEventListener('click', () => handleSquareClick(squareId));
          boardEl.appendChild(squareEl);
        }
      }
    }

    function handleSquareClick(squareId) {
      const lvl = levels[currentLevelIndex];
      if (!selectedSquare) {
        if (currentBoardState[squareId] && currentBoardState[squareId] === currentBoardState[squareId].toUpperCase()) {
          selectedSquare = squareId;
          renderBoard();
        }
      } else {
        // Move match check
        if (selectedSquare === lvl.winningMove.from && squareId === lvl.winningMove.to) {
          currentBoardState[squareId] = currentBoardState[selectedSquare];
          delete currentBoardState[selectedSquare];
          selectedSquare = null;
          renderBoard();

          setTimeout(() => {
            document.getElementById('modalMsg').innerText = lvl.message;
            document.getElementById('modalHeader').innerText = lvl.level === 10 ? "Game Completed! 💖" : "Level Complete! 🎉";
            document.getElementById('nextBtn').innerText = lvl.level === 10 ? "Replay Game 🔄" : "Proceed to Next Level ➔";
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('successModal').style.display = 'block';
          }, 300);
        } else {
          selectedSquare = null;
          renderBoard();
        }
      }
    }

    function nextLevel() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('successModal').style.display = 'none';
      currentLevelIndex = (currentLevelIndex < levels.length - 1) ? currentLevelIndex + 1 : 0;
      loadPasswordScreen();
    }

    loadPasswordScreen();
  </script>
</body>
</html>
